<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailor — Chalk, then thread.</title>
    <meta name="description" content="Tailor. A seam along the cloth." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2c2824; --muted: #7a746c; --paper: #f7f4ef;
        --card: #fffdfb; --accent: #2457c5;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Karla", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .cloth{position:absolute;left:16%;right:16%;top:40px;bottom:30px;background:#efe6da}.seam{position:absolute;left:20%;top:50px;width:3px;height:0;background:var(--accent);animation:seam 2.8s linear infinite}@keyframes seam{to{height:150px}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Tailor</a>
      <span>The shop</span>
    </header>
    <main id="top">
      <h1>Chalk, then thread.</h1>
      <p class="lede">A seam along the cloth.</p>
      <div class="stage" aria-hidden="true"><span class="cloth"></span><span class="go seam"></span></div>
    </main>
    <footer>
      <span>The shop</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
