<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metronome — It keeps the promise.</title>
    <meta name="description" content="Metronome. Left, right, left." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2c2820; --muted: #7a7364; --paper: #f6f3ec;
        --card: #fbf9f5; --accent: #c4553a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Inter", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .body{position:absolute;left:50%;bottom:16px;width:90px;height:170px;margin-left:-45px;background:#e6d7bf;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}.arm{position:absolute;left:50%;bottom:40px;width:6px;height:130px;margin-left:-3px;background:var(--ink);transform-origin:bottom center;animation:tick 1s ease-in-out infinite}@keyframes tick{0%{transform:rotate(-24deg)}100%{transform:rotate(24deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Metronome</a>
      <span>On the piano</span>
    </header>
    <main id="top">
      <h1>It keeps the promise.</h1>
      <p class="lede">Left, right, left.</p>
      <div class="stage" aria-hidden="true"><span class="body"></span><span class="go arm"></span></div>
    </main>
    <footer>
      <span>On the piano</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
