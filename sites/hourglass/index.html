<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hourglass — Sand, with a deadline.</title>
    <meta name="description" content="Hourglass. The top grows light." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2e2a22; --muted: #7a7364; --paper: #f6f3ec;
        --card: #fbf9f5; --accent: #e2c07a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Hind", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .glass{position:absolute;left:50%;top:20px;width:90px;height:180px;margin-left:-45px;background:#efe6d4;clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%,40% 50%)}.sand{position:absolute;left:50%;bottom:28px;width:70px;height:8px;margin-left:-35px;background:var(--accent);animation:sand 4s linear infinite}@keyframes sand{to{height:70px}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Hourglass</a>
      <span>On the desk</span>
    </header>
    <main id="top">
      <h1>Sand, with a deadline.</h1>
      <p class="lede">The top grows light.</p>
      <div class="stage" aria-hidden="true"><span class="glass"></span><span class="go sand"></span></div>
    </main>
    <footer>
      <span>On the desk</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
