<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folded map — A coast, opened flat.</title>
    <meta name="description" content="Folded map. The creases remember the pocket." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #1c3028; --muted: #5c7068; --paper: #f3f6f4;
        --card: #f7faf8; --accent: #d7e4da;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Space Grotesk", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .map{position:absolute;left:30%;top:40px;width:40%;height:140px;background:var(--accent);transform-origin:left center;animation:unfold 3.6s ease-in-out infinite}@keyframes unfold{50%,100%{width:78%;left:12%}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Folded map</a>
      <span>The glove box</span>
    </header>
    <main id="top">
      <h1>A coast, opened flat.</h1>
      <p class="lede">The creases remember the pocket.</p>
      <div class="stage" aria-hidden="true"><span class="go map"></span></div>
    </main>
    <footer>
      <span>The glove box</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
