<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Awning — Shade, unrolled.</title>
    <meta name="description" content="Awning. The shop front takes the sun off the walk." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #242824; --muted: #6c746c; --paper: #f5f4f0;
        --card: #fbfaf8; --accent: #d4533c;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Albert Sans", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .front{position:absolute;left:18%;right:18%;bottom:0;height:120px;background:#e7e2d8}.shade{position:absolute;left:16%;right:16%;top:24px;height:16px;background:repeating-linear-gradient(90deg,var(--accent) 0 18px,#f2d3cc 18px 28px);transform-origin:top;animation:unfurl 3.2s ease-out infinite}@keyframes unfurl{to{height:70px}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Awning</a>
      <span>Open</span>
    </header>
    <main id="top">
      <h1>Shade, unrolled.</h1>
      <p class="lede">The shop front takes the sun off the walk.</p>
      <div class="stage" aria-hidden="true"><span class="front"></span><span class="go shade"></span></div>
    </main>
    <footer>
      <span>Open</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
