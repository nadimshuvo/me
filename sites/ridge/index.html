<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ridge — Cloud, then the line of the hill.</title>
    <meta name="description" content="Ridge. The path stays put." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #1c2c38; --muted: #5c7080; --paper: #f4f7f8;
        --card: #f8fbfc; --accent: #d5dee6;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Inconsolata", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .hill{position:absolute;left:0;right:0;bottom:0;height:90px;background:#c5d2c0}.cloud{position:absolute;top:28px;left:-20%;width:160px;height:36px;background:var(--accent);border-radius:20px;animation:pass 7s linear infinite}@keyframes pass{to{left:100%}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Ridge</a>
      <span>The walk</span>
    </header>
    <main id="top">
      <h1>Cloud, then the line of the hill.</h1>
      <p class="lede">The path stays put.</p>
      <div class="stage" aria-hidden="true"><span class="hill"></span><span class="go cloud"></span></div>
    </main>
    <footer>
      <span>The walk</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
