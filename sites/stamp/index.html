<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stamp — A mark in the corner.</title>
    <meta name="description" content="Stamp. Posted, and dated." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Signika:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2e2820; --muted: #7d7468; --paper: #f7f4ee;
        --card: #fbfaf7; --accent: #c4372f;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Signika", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .paper{position:absolute;inset:28px;background:#fff;border:1px solid #e6dccb}.mark{position:absolute;right:48px;top:48px;width:70px;height:70px;border:4px solid var(--accent);border-radius:50%;opacity:0;animation:post 2.6s ease-out infinite}@keyframes post{30%,100%{opacity:1;transform:rotate(-12deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Stamp</a>
      <span>The envelope</span>
    </header>
    <main id="top">
      <h1>A mark in the corner.</h1>
      <p class="lede">Posted, and dated.</p>
      <div class="stage" aria-hidden="true"><span class="paper"></span><span class="go mark"></span></div>
    </main>
    <footer>
      <span>The envelope</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
