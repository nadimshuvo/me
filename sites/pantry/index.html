<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantry — Jars in a row.</title>
    <meta name="description" content="Pantry. Labels out, lids tight." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2e2a22; --muted: #7d7668; --paper: #f6f3ec;
        --card: #fbfaf6; --accent: #6a8f4e;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Atkinson Hyperlegible", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .shelf{position:absolute;left:10%;right:10%;bottom:50px;height:8px;background:#cbb89a}.jar{position:absolute;bottom:58px;width:40px;height:70px;background:#f4efe4;border:2px solid var(--ink);border-radius:6px}.a{left:22%;animation:slide 3.5s ease-in-out infinite}.b{left:44%}.c{left:66%}.jar:after{content:'';position:absolute;left:8px;right:8px;top:24px;height:8px;background:var(--accent)}@keyframes slide{50%{transform:translateX(28px)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Pantry</a>
      <span>The shelf</span>
    </header>
    <main id="top">
      <h1>Jars in a row.</h1>
      <p class="lede">Labels out, lids tight.</p>
      <div class="stage" aria-hidden="true"><span class="shelf"></span><span class="go jar a"></span><span class="jar b"></span><span class="jar c"></span></div>
    </main>
    <footer>
      <span>The shelf</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
