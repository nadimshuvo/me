<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Potter — The wheel keeps the clay.</title>
    <meta name="description" content="Potter. Hands steady, the form rises." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #3a2a22; --muted: #8a7064; --paper: #f3ece4;
        --card: #fffaf6; --accent: #c46a45;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Source Serif 4", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .wheel{position:absolute;left:50%;bottom:24px;width:150px;height:18px;margin-left:-75px;background:#d9c3b2;border-radius:50%;animation:spin 1.4s linear infinite}.pot{position:absolute;left:50%;bottom:40px;width:46px;margin-left:-23px;height:20px;background:var(--accent);border-radius:8px 8px 16px 16px;animation:rise 4s ease-out infinite}@keyframes spin{to{transform:rotateX(70deg) rotate(360deg)}}@keyframes rise{to{height:110px;bottom:40px}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Potter</a>
      <span>Wet clay</span>
    </header>
    <main id="top">
      <h1>The wheel keeps the clay.</h1>
      <p class="lede">Hands steady, the form rises.</p>
      <div class="stage" aria-hidden="true"><span class="go wheel"></span><span class="go pot"></span></div>
    </main>
    <footer>
      <span>Wet clay</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
