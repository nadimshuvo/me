<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quilt — A line of stitches.</title>
    <meta name="description" content="Quilt. The needle finds the next square." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #3a2c28; --muted: #8d746c; --paper: #f7f1ea;
        --card: #fffaf7; --accent: #c4473a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Domine", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .grid{position:absolute;inset:28px;background:repeating-linear-gradient(90deg,#eadfd4 0 25%,transparent 25% 25.6%),repeating-linear-gradient(#eadfd4 0 25%,transparent 25% 25.6%),#fff}.stitch{position:absolute;left:28px;top:46%;height:3px;width:0;background:var(--accent);animation:sew 3.2s linear infinite}@keyframes sew{to{width:calc(100% - 56px)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Quilt</a>
      <span>By the window</span>
    </header>
    <main id="top">
      <h1>A line of stitches.</h1>
      <p class="lede">The needle finds the next square.</p>
      <div class="stage" aria-hidden="true"><span class="grid"></span><span class="go stitch"></span></div>
    </main>
    <footer>
      <span>By the window</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
