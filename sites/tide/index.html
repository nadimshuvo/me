<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tide — The water comes back.</title>
    <meta name="description" content="Tide. A line on the wall, and the hour it reaches." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #14343c; --muted: #4c6c74; --paper: #e5f2f3;
        --card: #f3fbfb; --accent: #1b7380;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Fraunces", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .mark{position:absolute;left:16%;top:16%;width:2px;height:68%;background:var(--ink);opacity:.4}.sea{position:absolute;left:0;right:0;bottom:0;height:38%;background:var(--accent);animation:tide 5.2s ease-in-out infinite}@keyframes tide{50%{height:78%}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Tide</a>
      <span>Twice a day</span>
    </header>
    <main id="top">
      <h1>The water comes back.</h1>
      <p class="lede">A line on the wall, and the hour it reaches.</p>
      <div class="stage" aria-hidden="true"><span class="mark"></span><span class="go sea"></span></div>
    </main>
    <footer>
      <span>Twice a day</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
