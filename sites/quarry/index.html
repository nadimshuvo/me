<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quarry — A block leaves the face.</title>
    <meta name="description" content="Quarry. Stone, cut and lifted." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2a2c2e; --muted: #6c7074; --paper: #f2f3f2;
        --card: #f7f8f8; --accent: #b7b2a8;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Arimo", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .face{position:absolute;left:0;bottom:0;width:46%;height:100%;background:#d5d2cc}.block{position:absolute;left:20%;bottom:40px;width:70px;height:50px;background:var(--accent);animation:lift 3.4s ease-in-out infinite}@keyframes lift{70%,100%{transform:translate(220px,-90px)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Quarry</a>
      <span>The pit</span>
    </header>
    <main id="top">
      <h1>A block leaves the face.</h1>
      <p class="lede">Stone, cut and lifted.</p>
      <div class="stage" aria-hidden="true"><span class="face"></span><span class="go block"></span></div>
    </main>
    <footer>
      <span>The pit</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
