<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Porch — The seat swings.</title>
    <meta name="description" content="Porch. A chain, and the afternoon." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2a2e28; --muted: #6e766c; --paper: #f6f4ee;
        --card: #fbfaf7; --accent: #6e8f62;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Mulish", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .chain{position:absolute;top:0;width:2px;height:70px;background:#b7b1a6}.a{left:34%}.b{left:66%}.seat{position:absolute;left:28%;top:68px;width:44%;height:28px;background:var(--accent);border-radius:6px;transform-origin:center -70px;animation:swing 3.2s ease-in-out infinite}@keyframes swing{50%{transform:rotate(8deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Porch</a>
      <span>The front</span>
    </header>
    <main id="top">
      <h1>The seat swings.</h1>
      <p class="lede">A chain, and the afternoon.</p>
      <div class="stage" aria-hidden="true"><span class="chain a"></span><span class="chain b"></span><span class="go seat"></span></div>
    </main>
    <footer>
      <span>The front</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
