<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelp — The forest leans.</title>
    <meta name="description" content="Kelp. Fronds follow the tide." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #12352c; --muted: #3f6b5c; --paper: #e4f3ee;
        --card: #f3faf7; --accent: #1f8a62;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Instrument Serif", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .frond{position:absolute;bottom:0;width:14px;height:170px;background:var(--accent);border-radius:20px 20px 0 0;transform-origin:bottom center}.a{left:28%;animation:sway 3.4s ease-in-out infinite}.b{left:48%;height:200px;animation:sway 4.1s ease-in-out infinite reverse}.c{left:66%;height:150px;animation:sway 3.1s ease-in-out infinite}@keyframes sway{50%{transform:rotate(12deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Kelp</a>
      <span>Below the boat</span>
    </header>
    <main id="top">
      <h1>The forest leans.</h1>
      <p class="lede">Fronds follow the tide.</p>
      <div class="stage" aria-hidden="true"><span class="go frond a"></span><span class="go frond b"></span><span class="go frond c"></span></div>
    </main>
    <footer>
      <span>Below the boat</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
