<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lantern — A small light, carried.</title>
    <meta name="description" content="Lantern. The glow keeps a walking pace." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #f2efe6; --muted: #b7c0c8; --paper: #1c2430;
        --card: #121820; --accent: #f0c56e;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Spectral", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .stage{background:#121820}.lamp{position:absolute;left:10%;top:70px;width:36px;height:48px;background:var(--accent);border-radius:8px;box-shadow:0 0 0 0 rgba(240,197,110,.45);animation:carry 5.5s ease-in-out infinite}@keyframes carry{50%{left:78%;box-shadow:0 0 40px 16px rgba(240,197,110,.35)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Lantern</a>
      <span>After dusk</span>
    </header>
    <main id="top">
      <h1>A small light, carried.</h1>
      <p class="lede">The glow keeps a walking pace.</p>
      <div class="stage" aria-hidden="true"><span class="go lamp"></span></div>
    </main>
    <footer>
      <span>After dusk</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
