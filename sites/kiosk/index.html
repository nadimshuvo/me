<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiosk — The shutter lifts.</title>
    <meta name="description" content="Kiosk. Open, for the morning papers." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #242824; --muted: #6e756c; --paper: #f4f2ec;
        --card: #fbfaf6; --accent: #2f6b4f;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Outfit", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .box{position:absolute;left:50%;bottom:0;width:200px;height:180px;margin-left:-100px;background:#d9e2da}.shutter{position:absolute;left:50%;top:20px;width:200px;height:140px;margin-left:-100px;background:var(--accent);transform-origin:top;animation:lift 3.4s ease-in-out infinite}@keyframes lift{60%,100%{transform:scaleY(.15)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Kiosk</a>
      <span>The corner</span>
    </header>
    <main id="top">
      <h1>The shutter lifts.</h1>
      <p class="lede">Open, for the morning papers.</p>
      <div class="stage" aria-hidden="true"><span class="box"></span><span class="go shutter"></span></div>
    </main>
    <footer>
      <span>The corner</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
