<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Night train — Windows, then none.</title>
    <meta name="description" content="Night train. A late train along the cutting." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vollkorn:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #e8eef2; --muted: #9aa6b0; --paper: #101418;
        --card: #0c1014; --accent: #f2d48a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Vollkorn", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .stage{background:#0c1014}.train{position:absolute;top:96px;left:-40%;width:70%;height:36px;background:#2a3340;border-radius:6px;animation:pass 4.2s linear infinite}.train:before{content:'';position:absolute;left:10px;right:10px;top:8px;height:12px;background:repeating-linear-gradient(90deg,var(--accent) 0 18px,transparent 18px 32px)}@keyframes pass{to{left:110%}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Night train</a>
      <span>Last service</span>
    </header>
    <main id="top">
      <h1>Windows, then none.</h1>
      <p class="lede">A late train along the cutting.</p>
      <div class="stage" aria-hidden="true"><span class="go train"></span></div>
    </main>
    <footer>
      <span>Last service</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
