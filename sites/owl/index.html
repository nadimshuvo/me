<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owl — It watches, then blinks.</title>
    <meta name="description" content="Owl. Still, until it is not." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Faustina:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #f3f6f0; --muted: #c5d0c4; --paper: #1a221c;
        --card: #121814; --accent: #f2e27a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Faustina", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .stage{background:#121814}.head{position:absolute;left:50%;top:48px;width:110px;height:90px;margin-left:-55px;background:#2c3830;border-radius:50px;animation:tilt 5s ease-in-out infinite}.head:before,.head:after{content:'';position:absolute;top:28px;width:22px;height:22px;border-radius:50%;background:var(--accent)}.head:before{left:22px}.head:after{right:22px}@keyframes tilt{40%{transform:rotate(-8deg)}70%{transform:rotate(10deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Owl</a>
      <span>The oak</span>
    </header>
    <main id="top">
      <h1>It watches, then blinks.</h1>
      <p class="lede">Still, until it is not.</p>
      <div class="stage" aria-hidden="true"><span class="go head"></span></div>
    </main>
    <footer>
      <span>The oak</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
