<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hearth — The log takes.</title>
    <meta name="description" content="Hearth. Heat, then a bed of red." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2e241c; --muted: #8a7364; --paper: #f6f1ea;
        --card: #fffaf6; --accent: #e25822;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Syne", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .log{position:absolute;left:28%;right:28%;bottom:40px;height:22px;background:#6b4a32;border-radius:11px}.fire{position:absolute;left:40%;bottom:58px;width:40px;height:20px;background:var(--accent);border-radius:20px 20px 6px 6px;animation:flame 1.3s ease-in-out infinite}@keyframes flame{50%{height:70px;left:42%}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Hearth</a>
      <span>The room</span>
    </header>
    <main id="top">
      <h1>The log takes.</h1>
      <p class="lede">Heat, then a bed of red.</p>
      <div class="stage" aria-hidden="true"><span class="log"></span><span class="go fire"></span></div>
    </main>
    <footer>
      <span>The room</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
