<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Letterpress — Type meets paper.</title>
    <meta name="description" content="Letterpress. An impression, and the ink stays." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2a241c; --muted: #7a7064; --paper: #f6f3ec;
        --card: #fbf9f5; --accent: #1d3fbf;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Mukta", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .sheet{position:absolute;left:18%;right:18%;bottom:28px;height:80px;background:#fff}.type{position:absolute;left:30%;top:20px;width:80px;height:24px;background:var(--ink);animation:stamp 2.2s ease-in infinite}@keyframes stamp{40%,55%{top:140px}56%{top:20px}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Letterpress</a>
      <span>The bed</span>
    </header>
    <main id="top">
      <h1>Type meets paper.</h1>
      <p class="lede">An impression, and the ink stays.</p>
      <div class="stage" aria-hidden="true"><span class="sheet"></span><span class="go type"></span></div>
    </main>
    <footer>
      <span>The bed</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
