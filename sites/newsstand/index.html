<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News stand — The top sheet turns.</title>
    <meta name="description" content="News stand. Yesterday, then today." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #24221e; --muted: #7a756c; --paper: #f6f4ef;
        --card: #fffdfb; --accent: #f7f4ee;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Figtree", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .stack{position:absolute;left:50%;top:70px;width:180px;height:110px;margin-left:-90px;background:#e7e0d4}.sheet{position:absolute;left:50%;top:70px;width:180px;height:110px;margin-left:-90px;background:var(--accent);transform-origin:left center;animation:flip 3s ease-in-out infinite}@keyframes flip{50%{transform:rotateY(-160deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">News stand</a>
      <span>The pavement</span>
    </header>
    <main id="top">
      <h1>The top sheet turns.</h1>
      <p class="lede">Yesterday, then today.</p>
      <div class="stage" aria-hidden="true"><span class="stack"></span><span class="go sheet"></span></div>
    </main>
    <footer>
      <span>The pavement</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
