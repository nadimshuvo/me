<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moth — Around the lamp.</title>
    <meta name="description" content="Moth. It will not leave the light." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #f6f1e8; --muted: #cbbba8; --paper: #221c18;
        --card: #161210; --accent: #f4e2b0;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Crimson Pro", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .stage{background:#161210}.bulb{position:absolute;left:50%;top:36px;width:18px;height:18px;margin-left:-9px;background:var(--accent);border-radius:50%;box-shadow:0 0 24px 8px rgba(244,226,176,.45)}.moth{position:absolute;left:50%;top:70px;width:16px;height:10px;margin-left:-8px;background:#efe8dc;border-radius:8px;animation:loop 3.6s linear infinite}@keyframes loop{25%{transform:translate(70px,20px)}50%{transform:translate(0,70px)}75%{transform:translate(-70px,20px)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Moth</a>
      <span>The porch</span>
    </header>
    <main id="top">
      <h1>Around the lamp.</h1>
      <p class="lede">It will not leave the light.</p>
      <div class="stage" aria-hidden="true"><span class="bulb"></span><span class="go moth"></span></div>
    </main>
    <footer>
      <span>The porch</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
