<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade — A row of lamps, in order.</title>
    <meta name="description" content="Arcade. One stays lit a moment longer." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #242428; --muted: #6e6e78; --paper: #f4f3f0;
        --card: #fbfaf8; --accent: #f0c14a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "DM Sans", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .lamp{position:absolute;top:70px;width:36px;height:36px;border-radius:50%;background:#ddd8d0}.a{left:18%;animation:on 2.4s steps(1) infinite}.b{left:36%;animation:on 2.4s steps(1) .6s infinite}.c{left:54%;animation:on 2.4s steps(1) 1.2s infinite}.d{left:72%;animation:on 2.4s steps(1) 1.8s infinite}@keyframes on{50%{background:var(--accent)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Arcade</a>
      <span>The passage</span>
    </header>
    <main id="top">
      <h1>A row of lamps, in order.</h1>
      <p class="lede">One stays lit a moment longer.</p>
      <div class="stage" aria-hidden="true"><span class="go lamp a"></span><span class="go lamp b"></span><span class="go lamp c"></span><span class="go lamp d"></span></div>
    </main>
    <footer>
      <span>The passage</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
