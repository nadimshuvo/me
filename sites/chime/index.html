<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chime — Tubes, in order.</title>
    <meta name="description" content="Chime. The longest speaks last." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #1e2c2a; --muted: #5e726e; --paper: #f4f6f5;
        --card: #f8faf9; --accent: #d7c07a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Quicksand", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .tube{position:absolute;top:20px;width:16px;background:var(--accent);transform-origin:top center}.a{left:32%;height:90px;animation:hit 2.4s ease-in-out infinite}.b{left:48%;height:120px;animation:hit 2.4s ease-in-out .4s infinite}.c{left:64%;height:150px;animation:hit 2.4s ease-in-out .8s infinite}@keyframes hit{20%{transform:rotate(8deg)}40%{transform:rotate(0)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Chime</a>
      <span>The porch</span>
    </header>
    <main id="top">
      <h1>Tubes, in order.</h1>
      <p class="lede">The longest speaks last.</p>
      <div class="stage" aria-hidden="true"><span class="go tube a"></span><span class="go tube b"></span><span class="go tube c"></span></div>
    </main>
    <footer>
      <span>The porch</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
