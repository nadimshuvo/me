<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map room — The rose points.</title>
    <meta name="description" content="Map room. A table wide enough for a coast." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2a2c28; --muted: #6e7268; --paper: #f3f1ea;
        --card: #faf9f5; --accent: #c4473a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Schibsted Grotesk", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .table{position:absolute;left:10%;right:10%;top:30px;bottom:20px;background:#e7f0e4;border-radius:8px}.rose{position:absolute;left:50%;top:70px;width:4px;height:50px;margin-left:-2px;background:var(--accent);transform-origin:bottom center;animation:seek 4s ease-in-out infinite}@keyframes seek{40%{transform:rotate(40deg)}70%{transform:rotate(-20deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Map room</a>
      <span>The chart</span>
    </header>
    <main id="top">
      <h1>The rose points.</h1>
      <p class="lede">A table wide enough for a coast.</p>
      <div class="stage" aria-hidden="true"><span class="table"></span><span class="go rose"></span></div>
    </main>
    <footer>
      <span>The chart</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
