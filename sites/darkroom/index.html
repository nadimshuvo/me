<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark room — The picture arrives in the tray.</title>
    <meta name="description" content="Dark room. Red light, and patience." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #f8e8e6; --muted: #d8a8a4; --paper: #2a1214;
        --card: #1a0c0e; --accent: #f2f2f2;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Instrument Sans", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .stage{background:#1a0c0e}.tray{position:absolute;left:16%;right:16%;bottom:28px;height:50px;background:#6a3030;border-radius:6px}.photo{position:absolute;left:28%;right:28%;bottom:40px;height:90px;background:var(--accent);animation:develop 4.5s ease-out infinite}@keyframes develop{to{filter:contrast(1.4)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Dark room</a>
      <span>The sink</span>
    </header>
    <main id="top">
      <h1>The picture arrives in the tray.</h1>
      <p class="lede">Red light, and patience.</p>
      <div class="stage" aria-hidden="true"><span class="tray"></span><span class="go photo"></span></div>
    </main>
    <footer>
      <span>The sink</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
