<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apiary — The flight path home.</title>
    <meta name="description" content="Apiary. A box, and the bees around it." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #3a3218; --muted: #8a7a48; --paper: #f7f3e4;
        --card: #fffdf6; --accent: #e2b43a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Merriweather", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .hive{position:absolute;left:50%;bottom:24px;width:80px;height:90px;margin-left:-40px;background:var(--accent);border-radius:8px}.bee{position:absolute;left:20%;top:40px;width:14px;height:8px;background:var(--ink);border-radius:6px;animation:bee 3s linear infinite}@keyframes bee{50%{left:70%;top:30px}100%{left:48%;top:100px}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Apiary</a>
      <span>The hive</span>
    </header>
    <main id="top">
      <h1>The flight path home.</h1>
      <p class="lede">A box, and the bees around it.</p>
      <div class="stage" aria-hidden="true"><span class="hive"></span><span class="go bee"></span></div>
    </main>
    <footer>
      <span>The hive</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
