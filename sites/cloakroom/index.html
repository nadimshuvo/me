<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloak room — Coats, just in from the rain.</title>
    <meta name="description" content="Cloak room. They drip, then hang still." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2a2826; --muted: #7a746e; --paper: #f4f2ee;
        --card: #fafaf8; --accent: #3d5c8a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Public Sans", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .rail{position:absolute;left:12%;right:12%;top:28px;height:6px;background:#c8c2b8}.coat{position:absolute;left:40%;top:28px;width:70px;height:150px;background:var(--accent);border-radius:0 0 20px 20px;transform-origin:top center;animation:drip 2.4s ease-in-out infinite}@keyframes drip{50%{transform:rotate(6deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Cloak room</a>
      <span>The pegs</span>
    </header>
    <main id="top">
      <h1>Coats, just in from the rain.</h1>
      <p class="lede">They drip, then hang still.</p>
      <div class="stage" aria-hidden="true"><span class="rail"></span><span class="go coat"></span></div>
    </main>
    <footer>
      <span>The pegs</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
