<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belfry — The hour, once.</title>
    <meta name="description" content="Belfry. The bell leaves and returns." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #f4f2ea; --muted: #c4c6d0; --paper: #1b1e28;
        --card: #12141c; --accent: #d9c07a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Libre Caslon Text", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .stage{background:#12141c}.arch{position:absolute;left:50%;bottom:0;width:160px;height:180px;margin-left:-80px;border:14px solid #2c3142;border-bottom:0;border-radius:80px 80px 0 0}.bell{position:absolute;left:50%;top:36px;width:48px;height:54px;margin-left:-24px;background:var(--accent);border-radius:24px 24px 8px 8px;transform-origin:top center;animation:clang 2.8s ease-in-out infinite}@keyframes clang{20%{transform:rotate(18deg)}40%{transform:rotate(-14deg)}60%{transform:rotate(0)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Belfry</a>
      <span>The parish</span>
    </header>
    <main id="top">
      <h1>The hour, once.</h1>
      <p class="lede">The bell leaves and returns.</p>
      <div class="stage" aria-hidden="true"><span class="arch"></span><span class="go bell"></span></div>
    </main>
    <footer>
      <span>The parish</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
