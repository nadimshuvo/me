<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gear — Teeth meet teeth.</title>
    <meta name="description" content="Gear. One turn hands the next along." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2a2824; --muted: #74706a; --paper: #f4f3f0;
        --card: #fbfaf8; --accent: #2a2824;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Comfortaa", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .cog{position:absolute;top:50px;width:90px;height:90px;border-radius:50%;background:var(--accent)}.a{left:30%;animation:spin 4s linear infinite}.b{left:52%;animation:spin 4s linear infinite reverse}@keyframes spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Gear</a>
      <span>The works</span>
    </header>
    <main id="top">
      <h1>Teeth meet teeth.</h1>
      <p class="lede">One turn hands the next along.</p>
      <div class="stage" aria-hidden="true"><span class="go cog a"></span><span class="go cog b"></span></div>
    </main>
    <footer>
      <span>The works</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
