<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vineyard — Rows that meet.</title>
    <meta name="description" content="Vineyard. Vines, and the path between." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2e2818; --muted: #7a7050; --paper: #f6f4ec;
        --card: #fbfaf6; --accent: #6a8f3a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "PT Sans", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .row{position:absolute;left:10%;height:10px;background:var(--accent);transform-origin:left center}.a{top:50px;width:30%;animation:grow 3.4s ease-out infinite}.b{top:90px;animation:grow 3.4s ease-out .2s infinite}.c{top:130px;animation:grow 3.4s ease-out .4s infinite}@keyframes grow{to{width:80%}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Vineyard</a>
      <span>The slope</span>
    </header>
    <main id="top">
      <h1>Rows that meet.</h1>
      <p class="lede">Vines, and the path between.</p>
      <div class="stage" aria-hidden="true"><span class="go row a"></span><span class="go row b"></span><span class="go row c"></span></div>
    </main>
    <footer>
      <span>The slope</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
