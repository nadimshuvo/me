<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blotter — The drop spreads, then stops.</title>
    <meta name="description" content="Blotter. The desk keeps the rest." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2c241c; --muted: #7a6c60; --paper: #f6f3ee;
        --card: #fbf9f6; --accent: #1d3fbf;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Commissioner", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .pad{position:absolute;inset:24px;background:#efe6da}.drop{position:absolute;left:50%;top:46%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--accent);animation:spread 3s ease-out infinite}@keyframes spread{to{width:120px;height:80px;margin:-40px -60px;opacity:.85}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Blotter</a>
      <span>The blotter</span>
    </header>
    <main id="top">
      <h1>The drop spreads, then stops.</h1>
      <p class="lede">The desk keeps the rest.</p>
      <div class="stage" aria-hidden="true"><span class="pad"></span><span class="go drop"></span></div>
    </main>
    <footer>
      <span>The blotter</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
