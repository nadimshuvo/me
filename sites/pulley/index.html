<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulley — The rope takes the load.</title>
    <meta name="description" content="Pulley. Down on one side, up on the other." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #243028; --muted: #627068; --paper: #f4f5f3;
        --card: #f8faf8; --accent: #c9842a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Josefin Sans", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .wheel{position:absolute;left:50%;top:16px;width:36px;height:36px;margin-left:-18px;border:6px solid var(--ink);border-radius:50%}.load{position:absolute;top:70px;width:36px;height:36px;background:var(--accent)}.left{left:calc(50% - 54px);animation:down 3s ease-in-out infinite}.right{left:calc(50% + 18px);animation:down 3s ease-in-out infinite reverse}@keyframes down{50%{top:160px}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Pulley</a>
      <span>The beam</span>
    </header>
    <main id="top">
      <h1>The rope takes the load.</h1>
      <p class="lede">Down on one side, up on the other.</p>
      <div class="stage" aria-hidden="true"><span class="wheel"></span><span class="go load left"></span><span class="go load right"></span></div>
    </main>
    <footer>
      <span>The beam</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
