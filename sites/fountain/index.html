<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fountain — Three jets, one basin.</title>
    <meta name="description" content="Fountain. The water returns to itself." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #1c3034; --muted: #5c7478; --paper: #f3f6f6;
        --card: #f8fbfb; --accent: #3aa0b8;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Plus Jakarta Sans", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .basin{position:absolute;left:18%;right:18%;bottom:24px;height:28px;background:#d5e4e8;border-radius:0 0 20px 20px}.jet{position:absolute;bottom:48px;width:8px;height:20px;background:var(--accent);border-radius:8px}.a{left:32%;animation:jet 1.6s ease-in-out infinite}.b{left:50%;animation:jet 1.6s ease-in-out .2s infinite}.c{left:66%;animation:jet 1.6s ease-in-out .4s infinite}@keyframes jet{50%{height:110px}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Fountain</a>
      <span>The square</span>
    </header>
    <main id="top">
      <h1>Three jets, one basin.</h1>
      <p class="lede">The water returns to itself.</p>
      <div class="stage" aria-hidden="true"><span class="basin"></span><span class="go jet a"></span><span class="go jet b"></span><span class="go jet c"></span></div>
    </main>
    <footer>
      <span>The square</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
