<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compass — The needle looks north.</title>
    <meta name="description" content="Compass. The card can turn. It does not." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #1e2a24; --muted: #5e7068; --paper: #f4f6f4;
        --card: #f8faf8; --accent: #c4372f;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Poppins", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .card{position:absolute;left:50%;top:24px;width:160px;height:160px;margin-left:-80px;border:2px solid #c9d2cc;border-radius:50%}.needle{position:absolute;left:50%;top:40px;width:8px;height:70px;margin-left:-4px;background:var(--accent);clip-path:polygon(50% 0,100% 100%,0 100%);transform-origin:center 64px;animation:settle 3.5s ease-out infinite}@keyframes settle{0%{transform:rotate(80deg)}40%,100%{transform:rotate(0)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Compass</a>
      <span>The pocket</span>
    </header>
    <main id="top">
      <h1>The needle looks north.</h1>
      <p class="lede">The card can turn. It does not.</p>
      <div class="stage" aria-hidden="true"><span class="card"></span><span class="go needle"></span></div>
    </main>
    <footer>
      <span>The pocket</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
