<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Platform — departures</title>
    <meta name="description" content="Platform. Three departures. Choose one and read the board." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Figtree:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root { --bg: #07140e; --board: #0c2418; --ink: #d7ffe4; --dim: #7dba90; --amber: #e2c15a; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: Figtree, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.45; min-height: 100vh; }
      a { color: var(--amber); }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header, footer { display: flex; justify-content: space-between; align-items: baseline; }
      header { padding: 1.3rem 0; }
      .mark { font-weight: 700; letter-spacing: -0.04em; font-size: 1.3rem; color: var(--ink); text-decoration: none; }
      h1 { font-family: "Share Tech Mono", monospace; font-weight: 400; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -0.03em; }
      .lede { margin: 0.7rem 0 1rem; color: var(--dim); }
      table { width: 100%; border-collapse: collapse; font-family: "Share Tech Mono", monospace; }
      th { text-align: left; color: var(--dim); font-weight: 400; font-size: 0.78rem; padding-bottom: 0.45rem; }
      button { width: 100%; display: grid; grid-template-columns: 4.2rem 1fr auto; gap: 0.6rem; text-align: left; font: inherit; font-family: "Share Tech Mono", monospace; color: var(--ink); background: transparent; border: 0; border-top: 1px solid #1c4632; padding: 0.85rem 0; cursor: pointer; }
      button[aria-current="true"] { color: var(--amber); }
      .note { margin-top: 1rem; min-height: 1.4rem; color: var(--amber); font-family: "Share Tech Mono", monospace; }
      footer { padding: 2rem 0 3rem; color: var(--dim); font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Platform</a>
      <span>Live board</span>
    </header>
    <main id="top">
      <h1>DEPARTURES</h1>
      <p class="lede">Three trains still on the board. Choose one.</p>
      <table>
        <thead>
          <tr><th>Time</th><th>To</th><th>Plat.</th></tr>
        </thead>
        <tbody>
          <tr><td colspan="3"><button type="button" data-note="On time. Doors close one minute before." aria-current="true"><span>08:12</span><span>Harbor</span><span>2</span></button></td></tr>
          <tr><td colspan="3"><button type="button" data-note="Four minutes late. It is held at the signal."><span>08:27</span><span>North shed</span><span>5</span></button></td></tr>
          <tr><td colspan="3"><button type="button" data-note="This one stops only where the board says."><span>08:40</span><span>Mill</span><span>1</span></button></td></tr>
        </tbody>
      </table>
      <p class="note" id="note" role="status">On time. Doors close one minute before.</p>
    </main>
    <footer>
      <span>The main hall</span>
      <a href="../../index.html#studies">Nadim Mahmud Shuvo</a>
    </footer>
    <script>
      var note = document.getElementById("note");
      document.querySelectorAll("button").forEach(function (button) {
        button.addEventListener("click", function () {
          document.querySelectorAll("button").forEach(function (other) {
            other.removeAttribute("aria-current");
          });
          button.setAttribute("aria-current", "true");
          note.textContent = button.dataset.note;
        });
      });
    </script>
  </body>
</html>
