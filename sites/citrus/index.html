<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citrus — Cut, and the wheel shows.</title>
    <meta name="description" content="Citrus. Bright, and a little sharp." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2e3318; --muted: #74784a; --paper: #f8f6ee;
        --card: #fffdf6; --accent: #f0b429;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Abril Fatface", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .slice{position:absolute;left:50%;top:36px;width:150px;height:150px;margin-left:-75px;border-radius:50%;background:conic-gradient(var(--accent) 0 25%,#fff6d8 0 50%,var(--accent) 0 75%,#fff6d8 0);animation:spin 7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Citrus</a>
      <span>The board</span>
    </header>
    <main id="top">
      <h1>Cut, and the wheel shows.</h1>
      <p class="lede">Bright, and a little sharp.</p>
      <div class="stage" aria-hidden="true"><span class="go slice"></span></div>
    </main>
    <footer>
      <span>The board</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
