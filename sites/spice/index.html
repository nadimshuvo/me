<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spice — A pinch, falling.</title>
    <meta name="description" content="Spice. The jar is heavier than it looks." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #3a2418; --muted: #8d6854; --paper: #f8f1e6;
        --card: #fffaf5; --accent: #c4552a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Young Serif", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .jar{position:absolute;left:50%;top:16px;width:54px;height:70px;margin-left:-27px;background:#f4e2c8;border:2px solid var(--ink);border-radius:6px}.dust{position:absolute;left:50%;top:86px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent);opacity:0;animation:fall 1.8s linear infinite}@keyframes fall{0%{opacity:1;transform:translateY(0)}100%{opacity:.2;transform:translateY(110px)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Spice</a>
      <span>The shelf</span>
    </header>
    <main id="top">
      <h1>A pinch, falling.</h1>
      <p class="lede">The jar is heavier than it looks.</p>
      <div class="stage" aria-hidden="true"><span class="jar"></span><span class="go dust"></span></div>
    </main>
    <footer>
      <span>The shelf</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
