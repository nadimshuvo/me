<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barrel — Catch the rain.</title>
    <meta name="description" content="Barrel. The line rises with the weather." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #243024; --muted: #5d6b58; --paper: #eef3ea;
        --card: #f7faf4; --accent: #6e8f4e;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "EB Garamond", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .cask{position:absolute;left:50%;bottom:28px;width:140px;height:160px;margin-left:-70px;border:3px solid var(--ink);border-radius:16px;overflow:hidden}.fill{position:absolute;left:50%;bottom:31px;width:134px;margin-left:-67px;height:20%;background:var(--accent);border-radius:0 0 12px 12px;animation:fill 5s ease-in infinite}@keyframes fill{80%,100%{height:150px}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Barrel</a>
      <span>Under the spout</span>
    </header>
    <main id="top">
      <h1>Catch the rain.</h1>
      <p class="lede">The line rises with the weather.</p>
      <div class="stage" aria-hidden="true"><span class="cask"></span><span class="go fill"></span></div>
    </main>
    <footer>
      <span>Under the spout</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
