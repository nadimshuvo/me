<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nursery — Three shapes, turning.</title>
    <meta name="description" content="Nursery. Slow, above the crib." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #3a2e32; --muted: #8a7478; --paper: #f7f3f0;
        --card: #fffaf9; --accent: #e07a8a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Familjen Grotesk", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .bar{position:absolute;left:50%;top:0;width:4px;height:40px;margin-left:-2px;background:#c8b8b4}.arm{position:absolute;left:50%;top:36px;width:180px;height:4px;margin-left:-90px;background:#c8b8b4;animation:turn 8s linear infinite}.arm:before,.arm:after{content:'';position:absolute;top:8px;width:16px;height:16px;border-radius:50%;background:var(--accent)}.arm:before{left:0}.arm:after{right:0}@keyframes turn{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Nursery</a>
      <span>The mobile</span>
    </header>
    <main id="top">
      <h1>Three shapes, turning.</h1>
      <p class="lede">Slow, above the crib.</p>
      <div class="stage" aria-hidden="true"><span class="bar"></span><span class="go arm"></span></div>
    </main>
    <footer>
      <span>The mobile</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
