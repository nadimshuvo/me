<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tuning — The fork hums after the strike.</title>
    <meta name="description" content="Tuning. Hold it to the wood." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #242428; --muted: #707078; --paper: #f5f4f2;
        --card: #fbfbfa; --accent: #242428;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Cabin", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .fork{position:absolute;left:50%;top:24px;width:70px;height:120px;margin-left:-35px;border:8px solid var(--ink);border-bottom:0;border-radius:40px 40px 0 0;animation:hum .12s linear infinite}@keyframes hum{50%{transform:translateX(2px)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Tuning</a>
      <span>A440</span>
    </header>
    <main id="top">
      <h1>The fork hums after the strike.</h1>
      <p class="lede">Hold it to the wood.</p>
      <div class="stage" aria-hidden="true"><span class="go fork"></span></div>
    </main>
    <footer>
      <span>A440</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
