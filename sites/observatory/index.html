<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Observatory — The slit turns with the sky.</title>
    <meta name="description" content="Observatory. One opening, and the dark around it." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #e7eefc; --muted: #9aabc4; --paper: #121826;
        --card: #0e1420; --accent: #d5e2ff;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Bitter", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .stage{background:#0e1420}.dome{position:absolute;left:50%;bottom:20px;width:180px;height:90px;margin-left:-90px;background:#243044;border-radius:90px 90px 0 0}.slit{position:absolute;left:50%;bottom:20px;width:16px;height:90px;margin-left:-8px;background:var(--accent);transform-origin:center bottom;animation:slit 7s linear infinite}@keyframes slit{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Observatory</a>
      <span>Clear nights</span>
    </header>
    <main id="top">
      <h1>The slit turns with the sky.</h1>
      <p class="lede">One opening, and the dark around it.</p>
      <div class="stage" aria-hidden="true"><span class="dome"></span><span class="go slit"></span></div>
    </main>
    <footer>
      <span>Clear nights</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
