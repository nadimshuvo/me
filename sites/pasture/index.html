<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pasture — The gate swings in.</title>
    <meta name="description" content="Pasture. Grass on both sides." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #243024; --muted: #5e705c; --paper: #f3f6ef;
        --card: #f7faf5; --accent: #6b4a2a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Noto Serif", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .post{position:absolute;left:30%;bottom:20px;width:10px;height:150px;background:#8d7352}.gate{position:absolute;left:calc(30% + 10px);bottom:40px;width:140px;height:70px;border:6px solid var(--accent);transform-origin:left center;animation:open 3.6s ease-in-out infinite}@keyframes open{50%,100%{transform:rotate(-62deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Pasture</a>
      <span>The lane</span>
    </header>
    <main id="top">
      <h1>The gate swings in.</h1>
      <p class="lede">Grass on both sides.</p>
      <div class="stage" aria-hidden="true"><span class="post"></span><span class="go gate"></span></div>
    </main>
    <footer>
      <span>The lane</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
