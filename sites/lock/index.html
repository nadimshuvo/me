<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lock — The gates hold the river.</title>
    <meta name="description" content="Lock. Water waits, then levels." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #1b3038; --muted: #567078; --paper: #e6eef0;
        --card: #f4fafa; --accent: #2f8f9a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Cormorant Garamond", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .pool{position:absolute;left:0;right:0;bottom:0;height:30%;background:#b7dbe2}.gate{position:absolute;bottom:54px;width:18px;height:120px;background:var(--ink);transform-origin:center bottom}.left{left:30%;animation:openL 5s ease-in-out infinite}.right{right:30%;animation:openR 5s ease-in-out infinite}@keyframes openL{40%,60%{transform:rotate(58deg)}}@keyframes openR{40%,60%{transform:rotate(-58deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Lock</a>
      <span>Upstream</span>
    </header>
    <main id="top">
      <h1>The gates hold the river.</h1>
      <p class="lede">Water waits, then levels.</p>
      <div class="stage" aria-hidden="true"><span class="go gate left"></span><span class="go gate right"></span><span class="pool"></span></div>
    </main>
    <footer>
      <span>Upstream</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
