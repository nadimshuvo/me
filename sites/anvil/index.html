<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anvil — One strike, then the ring.</title>
    <meta name="description" content="Anvil. Iron, while it is hot." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2a2724; --muted: #7a736c; --paper: #f1eee8;
        --card: #fbfaf7; --accent: #c4552d;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Old Standard TT", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .anvil{position:absolute;left:50%;bottom:40px;width:160px;height:28px;margin-left:-70px;background:#4a4744;border-radius:4px}.hammer{position:absolute;left:58%;top:24px;width:16px;height:70px;background:var(--ink);transform-origin:top center;animation:strike 1.8s ease-in infinite}.hammer:before{content:'';position:absolute;bottom:-8px;left:-14px;width:44px;height:16px;background:var(--accent)}@keyframes strike{70%{transform:rotate(0)}85%{transform:rotate(70deg)}100%{transform:rotate(0)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Anvil</a>
      <span>The forge</span>
    </header>
    <main id="top">
      <h1>One strike, then the ring.</h1>
      <p class="lede">Iron, while it is hot.</p>
      <div class="stage" aria-hidden="true"><span class="anvil"></span><span class="go hammer"></span></div>
    </main>
    <footer>
      <span>The forge</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
