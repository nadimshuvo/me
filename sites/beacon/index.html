<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beacon — The light turns.</title>
    <meta name="description" content="Beacon. A beam, once each minute." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #1a2740; --muted: #52627d; --paper: #e7eef6;
        --card: #f8fafc; --accent: #d7e4ff;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Lora", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .tower{position:absolute;left:50%;bottom:0;width:28px;height:150px;margin-left:-14px;background:var(--ink)}.beam{position:absolute;left:50%;bottom:128px;width:220px;height:16px;margin-left:-8px;background:linear-gradient(90deg,var(--accent),transparent);transform-origin:8px 8px;animation:beam 4.8s linear infinite}@keyframes beam{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Beacon</a>
      <span>All night</span>
    </header>
    <main id="top">
      <h1>The light turns.</h1>
      <p class="lede">A beam, once each minute.</p>
      <div class="stage" aria-hidden="true"><span class="tower"></span><span class="go beam"></span></div>
    </main>
    <footer>
      <span>All night</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
