<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lathe — Round, by turning.</title>
    <meta name="description" content="Lathe. The blank sheds a curl." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2c2824; --muted: #7d756c; --paper: #f3f0ea;
        --card: #fbfaf7; --accent: #c9842a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Gelasio", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .bed{position:absolute;left:10%;right:10%;top:120px;height:10px;background:#cfc6ba}.blank{position:absolute;left:50%;top:78px;width:180px;height:36px;margin-left:-90px;background:var(--accent);border-radius:18px;animation:turn 1.1s linear infinite}@keyframes turn{to{transform:rotateX(360deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Lathe</a>
      <span>The shop</span>
    </header>
    <main id="top">
      <h1>Round, by turning.</h1>
      <p class="lede">The blank sheds a curl.</p>
      <div class="stage" aria-hidden="true"><span class="bed"></span><span class="go blank"></span></div>
    </main>
    <footer>
      <span>The shop</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
