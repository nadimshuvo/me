<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ford — Stones, set where the water is thin.</title>
    <meta name="description" content="Ford. A way across." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #1c3330; --muted: #5c746e; --paper: #f2f7f6;
        --card: #f7fbfa; --accent: #8fb8c4;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Space Mono", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .water{position:absolute;left:0;right:0;top:70px;height:50px;background:var(--accent)}.stone{position:absolute;top:78px;width:36px;height:22px;background:#d9d3c6;border-radius:10px}.a{left:22%;animation:step 2.2s ease-in-out infinite}.b{left:46%}.c{left:68%}@keyframes step{50%{transform:translateY(-8px)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Ford</a>
      <span>The stream</span>
    </header>
    <main id="top">
      <h1>Stones, set where the water is thin.</h1>
      <p class="lede">A way across.</p>
      <div class="stage" aria-hidden="true"><span class="water"></span><span class="go stone a"></span><span class="stone b"></span><span class="stone c"></span></div>
    </main>
    <footer>
      <span>The stream</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
