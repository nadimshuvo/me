<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creamery — The churn rocks.</title>
    <meta name="description" content="Creamery. Butter, given time." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lustria:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2e2a24; --muted: #7d7568; --paper: #f6f4ee;
        --card: #fffdf9; --accent: #f2f0ea;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Lustria", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .churn{position:absolute;left:50%;bottom:28px;width:70px;height:130px;margin-left:-35px;background:#d8d2c6;border-radius:12px 12px 20px 20px;transform-origin:bottom center;animation:rock 1.6s ease-in-out infinite}@keyframes rock{50%{transform:rotate(14deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Creamery</a>
      <span>The dairy</span>
    </header>
    <main id="top">
      <h1>The churn rocks.</h1>
      <p class="lede">Butter, given time.</p>
      <div class="stage" aria-hidden="true"><span class="go churn"></span></div>
    </main>
    <footer>
      <span>The dairy</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
