<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yo-yo — Down the string, and back.</title>
    <meta name="description" content="Yo-yo. The hand stays." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2a2828; --muted: #767272; --paper: #f6f4f2;
        --card: #fbfaf9; --accent: #d6453d;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Montserrat", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .string{position:absolute;left:50%;top:0;width:2px;height:70%;margin-left:-1px;background:#c8c4c0}.yoyo{position:absolute;left:50%;top:16px;width:48px;height:48px;margin-left:-24px;border-radius:50%;background:var(--accent);animation:drop 2s ease-in-out infinite}@keyframes drop{50%{top:170px}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Yo-yo</a>
      <span>The hall</span>
    </header>
    <main id="top">
      <h1>Down the string, and back.</h1>
      <p class="lede">The hand stays.</p>
      <div class="stage" aria-hidden="true"><span class="string"></span><span class="go yoyo"></span></div>
    </main>
    <footer>
      <span>The hall</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
