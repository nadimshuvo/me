<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buoy — It never sits still.</title>
    <meta name="description" content="Buoy. The mark rides the chop." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #1a3348; --muted: #56738a; --paper: #e7f1f8;
        --card: #f5f9fc; --accent: #e23b3b;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Playfair Display", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .sea{position:absolute;left:0;right:0;bottom:0;height:42%;background:#9ec4de}.buoy{position:absolute;left:46%;bottom:78px;width:36px;height:64px;background:var(--accent);border-radius:18px 18px 8px 8px;animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(16px) rotate(6deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Buoy</a>
      <span>Channel edge</span>
    </header>
    <main id="top">
      <h1>It never sits still.</h1>
      <p class="lede">The mark rides the chop.</p>
      <div class="stage" aria-hidden="true"><span class="sea"></span><span class="go buoy"></span></div>
    </main>
    <footer>
      <span>Channel edge</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
