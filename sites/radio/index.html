<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio — The dial looks for a voice.</title>
    <meta name="description" content="Radio. Static, then a station." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #242428; --muted: #6e6e76; --paper: #f3f1ec;
        --card: #fafaf8; --accent: #e23b3b;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Manrope", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .set{position:absolute;left:50%;top:40px;width:240px;height:140px;margin-left:-120px;background:#2c3038;border-radius:12px}.needle{position:absolute;left:50%;top:78px;width:4px;height:46px;margin-left:-70px;background:var(--accent);transform-origin:bottom center;animation:tune 3.4s ease-in-out infinite}@keyframes tune{50%{margin-left:60px}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Radio</a>
      <span>The shelf</span>
    </header>
    <main id="top">
      <h1>The dial looks for a voice.</h1>
      <p class="lede">Static, then a station.</p>
      <div class="stage" aria-hidden="true"><span class="set"></span><span class="go needle"></span></div>
    </main>
    <footer>
      <span>The shelf</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
