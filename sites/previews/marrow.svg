  <text x="56" y="214" font-family="Georgia, serif" font-size="58" fill="#2a2118">the street wakes.</text>
  <rect x="56" y="258" width="688" height="62" rx="16" fill="#fffaf3"/>
  <text x="80" y="296" font-family="Georgia, serif" font-size="24" fill="#2a2118">Country</text>
