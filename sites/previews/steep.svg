  <text x="80" y="266" font-family="Georgia, serif" font-size="24" fill="#1c3330">Green</text>
  <text x="716" y="266" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="16" fill="#5d7370">short</text>
