<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drum — The skin answers.</title>
    <meta name="description" content="Drum. A hand, then the ring." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2a2824; --muted: #76726c; --paper: #f4f2ec;
        --card: #fafaf7; --accent: #c4553a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Onest", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .skin{position:absolute;left:50%;top:40px;width:160px;height:90px;margin-left:-80px;background:#e6d3b0;border-radius:8px;border:6px solid var(--ink)}.ring{position:absolute;left:50%;top:70px;width:20px;height:20px;margin-left:-10px;border:3px solid var(--accent);border-radius:50%;animation:pulse 1.6s ease-out infinite}@keyframes pulse{to{width:140px;height:70px;margin-left:-70px;margin-top:-20px;opacity:0}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Drum</a>
      <span>The floor</span>
    </header>
    <main id="top">
      <h1>The skin answers.</h1>
      <p class="lede">A hand, then the ring.</p>
      <div class="stage" aria-hidden="true"><span class="skin"></span><span class="go ring"></span></div>
    </main>
    <footer>
      <span>The floor</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
