<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Copse — Leaves let go.</title>
    <meta name="description" content="Copse. A small wood, thinning." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cousine:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #243028; --muted: #5c7060; --paper: #f3f6f0;
        --card: #f7faf6; --accent: #c9842a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Cousine", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .tree{position:absolute;left:50%;bottom:0;width:16px;height:120px;margin-left:-8px;background:#6b4a32}.leaf{position:absolute;top:20px;width:12px;height:8px;background:var(--accent);border-radius:6px}.a{left:46%;animation:fall 3.2s linear infinite}.b{left:54%;animation:fall 3.6s linear .4s infinite}.c{left:50%;animation:fall 2.8s linear .8s infinite}@keyframes fall{to{transform:translateY(180px) rotate(40deg);opacity:.3}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Copse</a>
      <span>The edge</span>
    </header>
    <main id="top">
      <h1>Leaves let go.</h1>
      <p class="lede">A small wood, thinning.</p>
      <div class="stage" aria-hidden="true"><span class="tree"></span><span class="go leaf a"></span><span class="go leaf b"></span><span class="go leaf c"></span></div>
    </main>
    <footer>
      <span>The edge</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
