<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cairn — One stone, then another.</title>
    <meta name="description" content="Cairn. A mark for the next walker." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2c2e2a; --muted: #6e726c; --paper: #f5f4f0;
        --card: #fafaf8; --accent: #b7b2a6;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Courier Prime", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .stone{position:absolute;left:50%;background:var(--accent);border-radius:4px;opacity:0}.a{bottom:24px;width:90px;height:28px;margin-left:-45px;animation:stack 3.6s ease-out infinite}.b{bottom:52px;width:64px;height:24px;margin-left:-32px;animation:stack 3.6s ease-out .4s infinite}.c{bottom:76px;width:40px;height:20px;margin-left:-20px;animation:stack 3.6s ease-out .8s infinite}@keyframes stack{20%,100%{opacity:1}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Cairn</a>
      <span>The path</span>
    </header>
    <main id="top">
      <h1>One stone, then another.</h1>
      <p class="lede">A mark for the next walker.</p>
      <div class="stage" aria-hidden="true"><span class="go stone a"></span><span class="go stone b"></span><span class="go stone c"></span></div>
    </main>
    <footer>
      <span>The path</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
