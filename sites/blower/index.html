<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blower — A bubble at the end of the pipe.</title>
    <meta name="description" content="Blower. Breath makes the glass." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2e2824; --muted: #7e746c; --paper: #f6f3ee;
        --card: #fffcf8; --accent: #7ec8d4;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Zilla Slab", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .pipe{position:absolute;left:8%;top:110px;width:46%;height:8px;background:#8a8178}.bubble{position:absolute;left:52%;top:92px;width:28px;height:28px;border-radius:50%;background:var(--accent);opacity:.85;animation:blow 3.6s ease-in-out infinite}@keyframes blow{70%,100%{width:110px;height:110px;top:40px}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Blower</a>
      <span>Hot shop</span>
    </header>
    <main id="top">
      <h1>A bubble at the end of the pipe.</h1>
      <p class="lede">Breath makes the glass.</p>
      <div class="stage" aria-hidden="true"><span class="pipe"></span><span class="go bubble"></span></div>
    </main>
    <footer>
      <span>Hot shop</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
