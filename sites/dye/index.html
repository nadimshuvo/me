<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dye — The cloth goes under.</title>
    <meta name="description" content="Dye. Color climbs the thread." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #3a241c; --muted: #8d6a58; --paper: #f6efe8;
        --card: #fffaf6; --accent: #7a2ea8;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Gentium Book Plus", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .vat{position:absolute;left:50%;bottom:20px;width:200px;height:70px;margin-left:-100px;background:var(--accent);border-radius:0 0 16px 16px}.cloth{position:absolute;left:50%;top:0;width:70px;margin-left:-35px;height:40px;background:#f4efe6;animation:dip 4s ease-in-out infinite}@keyframes dip{50%{height:150px;background:#d9b4ea}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Dye</a>
      <span>The vat</span>
    </header>
    <main id="top">
      <h1>The cloth goes under.</h1>
      <p class="lede">Color climbs the thread.</p>
      <div class="stage" aria-hidden="true"><span class="vat"></span><span class="go cloth"></span></div>
    </main>
    <footer>
      <span>The vat</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
