<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand bell — It swings from the wrist.</title>
    <meta name="description" content="Hand bell. One tone, clean." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2c2a28; --muted: #7a7670; --paper: #f6f4ef;
        --card: #fbfaf8; --accent: #d4b15a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Urbanist", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .bell{position:absolute;left:50%;top:30px;width:70px;height:80px;margin-left:-35px;background:var(--accent);border-radius:8px 8px 30px 30px;transform-origin:top center;animation:swing 1.5s ease-in-out infinite}@keyframes swing{50%{transform:rotate(22deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Hand bell</a>
      <span>The choir stall</span>
    </header>
    <main id="top">
      <h1>It swings from the wrist.</h1>
      <p class="lede">One tone, clean.</p>
      <div class="stage" aria-hidden="true"><span class="go bell"></span></div>
    </main>
    <footer>
      <span>The choir stall</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
