<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bindery — A signature, folded.</title>
    <meta name="description" content="Bindery. The page turns into a book." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2e261c; --muted: #8d7d68; --paper: #f4efe6;
        --card: #fffaf3; --accent: #f7f1e6;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "IM Fell English", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .book{position:absolute;left:50%;top:40px;width:120px;height:160px;margin-left:-20px;background:#c4553a;border-radius:0 6px 6px 0}.page{position:absolute;left:50%;top:40px;width:120px;height:160px;margin-left:-140px;background:var(--accent);transform-origin:right center;animation:turn 3.4s ease-in-out infinite}@keyframes turn{50%{transform:rotateY(-150deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Bindery</a>
      <span>Sewn, not glued</span>
    </header>
    <main id="top">
      <h1>A signature, folded.</h1>
      <p class="lede">The page turns into a book.</p>
      <div class="stage" aria-hidden="true"><span class="book"></span><span class="go page"></span></div>
    </main>
    <footer>
      <span>Sewn, not glued</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
