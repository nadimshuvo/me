<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plot — a square of ground</title>
    <meta name="description" content="Plot rents a square of ground for a season. Choose a size." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #1c2a1a; --muted: #526354; --paper: #eef3e6; --card: #f7faf3; --green: #2f6a3a; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Source Sans 3", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: var(--green); }
      header, main, footer { width: min(760px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; padding: 1.4rem 0; }
      .mark { font-family: Fraunces, serif; font-size: 1.45rem; color: var(--ink); text-decoration: none; }
      h1 { font-family: Fraunces, serif; font-weight: 520; font-size: clamp(2.6rem, 7vw, 4.2rem); letter-spacing: -0.04em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.3rem; color: var(--muted); max-width: 34rem; }
      fieldset { border: 0; display: grid; gap: 0.6rem; }
      legend { font-weight: 600; margin-bottom: 0.6rem; }
      label { display: grid; grid-template-columns: auto 1fr auto; gap: 0.8rem; align-items: center; background: var(--card); border-radius: 16px; padding: 0.9rem 1rem; cursor: pointer; border: 1px solid transparent; }
      label:has(input:checked) { border-color: var(--green); }
      input { accent-color: var(--green); width: 1.05rem; height: 1.05rem; }
      strong { font-family: Fraunces, serif; font-size: 1.2rem; font-weight: 520; }
      .size { color: var(--muted); }
      .summary { margin-top: 1rem; font-weight: 600; }
      footer { padding: 2.2rem 0 3rem; display: flex; justify-content: space-between; color: var(--muted); font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Plot</a>
      <span>Season opens in March</span>
    </header>
    <main id="top">
      <h1>A square of ground, for a season.</h1>
      <p class="lede">Soil, water, and a shed for tools. You bring the seeds and the habit of showing up.</p>
      <fieldset>
        <legend>Choose a plot</legend>
        <label>
          <input type="radio" name="size" value="half" checked />
          <span><strong>Half</strong><br /><span class="size">A bed for herbs and a row of greens.</span></span>
          <span>900</span>
        </label>
        <label>
          <input type="radio" name="size" value="full" />
          <span><strong>Full</strong><br /><span class="size">Room for tomatoes, beans, and a place to sit.</span></span>
          <span>1600</span>
        </label>
        <label>
          <input type="radio" name="size" value="pair" />
          <span><strong>A pair</strong><br /><span class="size">Two full plots, sharing a path.</span></span>
          <span>2800</span>
        </label>
      </fieldset>
      <p class="summary" id="summary" role="status">Half a plot, for the season. 900.</p>
    </main>
    <footer>
      <span>The east field</span>
      <a href="../../index.html#studies">Nadim Mahmud Shuvo</a>
    </footer>
    <script>
      var lines = {
        half: "Half a plot, for the season. 900.",
        full: "A full plot, for the season. 1600.",
        pair: "Two plots, sharing a path. 2800."
      };
      document.querySelectorAll('input[name="size"]').forEach(function (input) {
        input.addEventListener("change", function () {
          document.getElementById("summary").textContent = lines[input.value];
        });
      });
    </script>
  </body>
</html>
