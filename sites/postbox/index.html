<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post box — The flag goes up.</title>
    <meta name="description" content="Post box. Someone will come for it." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2a2424; --muted: #7a6e6e; --paper: #f6f3ef;
        --card: #fffaf8; --accent: #c4372f;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Rubik", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .box{position:absolute;left:50%;bottom:20px;width:100px;height:140px;margin-left:-50px;background:var(--accent);border-radius:8px}.flag{position:absolute;left:calc(50% + 50px);bottom:100px;width:36px;height:8px;background:var(--ink);transform-origin:left center;transform:rotate(70deg);animation:flag 3s ease-in-out infinite}@keyframes flag{50%,100%{transform:rotate(0deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Post box</a>
      <span>The corner</span>
    </header>
    <main id="top">
      <h1>The flag goes up.</h1>
      <p class="lede">Someone will come for it.</p>
      <div class="stage" aria-hidden="true"><span class="box"></span><span class="go flag"></span></div>
    </main>
    <footer>
      <span>The corner</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
