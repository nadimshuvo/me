<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Well — The bucket goes down.</title>
    <meta name="description" content="Well. Rope, dark, and a full pull." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #1c2c38; --muted: #5a6d7a; --paper: #e7eef2;
        --card: #f7fafc; --accent: #3d6d86;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Newsreader", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .rope{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#c5d3dc}.bucket{position:absolute;left:calc(50% - 22px);top:18px;width:44px;height:36px;border:3px solid var(--accent);border-top:0;border-radius:0 0 10px 10px;animation:well 4.4s ease-in-out infinite}@keyframes well{50%{top:168px}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Well</a>
      <span>Hand over hand</span>
    </header>
    <main id="top">
      <h1>The bucket goes down.</h1>
      <p class="lede">Rope, dark, and a full pull.</p>
      <div class="stage" aria-hidden="true"><span class="rope"></span><span class="go bucket"></span></div>
    </main>
    <footer>
      <span>Hand over hand</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
