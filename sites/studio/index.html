<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio — North light, and a canvas.</title>
    <meta name="description" content="Studio. The rest of the room stays quiet." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #24282a; --muted: #6c7478; --paper: #f4f5f2;
        --card: #fbfcfb; --accent: #d8e4ea;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Source Sans 3", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .easel{position:absolute;left:50%;bottom:16px;width:120px;height:170px;margin-left:-60px;background:#f7f4ee;border:8px solid #c8bba8}.light{position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.7),transparent 60%);animation:pass 5s linear infinite}@keyframes pass{from{transform:translateX(-40%)}to{transform:translateX(40%)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Studio</a>
      <span>The north wall</span>
    </header>
    <main id="top">
      <h1>North light, and a canvas.</h1>
      <p class="lede">The rest of the room stays quiet.</p>
      <div class="stage" aria-hidden="true"><span class="easel"></span><span class="go light"></span></div>
    </main>
    <footer>
      <span>The north wall</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
