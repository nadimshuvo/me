<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferry — One crossing.</title>
    <meta name="description" content="Ferry. The boat leaves this bank for the other." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #163028; --muted: #4e6b60; --paper: #e4f0ea;
        --card: #f4fbf7; --accent: #1f7a62;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Literata", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .water{position:absolute;left:0;right:0;bottom:0;height:34%;background:#b7ddd0}.boat{position:absolute;bottom:58px;left:8%;width:92px;height:28px;background:var(--accent);border-radius:0 0 16px 16px;animation:ferry 6s linear infinite}.boat:before{content:'';position:absolute;left:28px;bottom:28px;width:8px;height:22px;background:var(--ink)}@keyframes ferry{to{left:78%}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Ferry</a>
      <span>On the hour</span>
    </header>
    <main id="top">
      <h1>One crossing.</h1>
      <p class="lede">The boat leaves this bank for the other.</p>
      <div class="stage" aria-hidden="true"><span class="water"></span><span class="go boat"></span></div>
    </main>
    <footer>
      <span>On the hour</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
