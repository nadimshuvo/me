<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margin — A note beside the line.</title>
    <meta name="description" content="Margin. Written after the book was." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=News+Cycle:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2c2824; --muted: #7a746c; --paper: #f7f5f0;
        --card: #fcfbf8; --accent: #c4553a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "News Cycle", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .rule{position:absolute;left:28%;top:20px;bottom:20px;width:1px;background:#ddd4c6}.note{position:absolute;left:8%;top:40px;width:0;height:3px;background:var(--accent);animation:note 2.6s linear infinite}@keyframes note{to{width:16%}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Margin</a>
      <span>The page</span>
    </header>
    <main id="top">
      <h1>A note beside the line.</h1>
      <p class="lede">Written after the book was.</p>
      <div class="stage" aria-hidden="true"><span class="rule"></span><span class="go note"></span></div>
    </main>
    <footer>
      <span>The page</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
