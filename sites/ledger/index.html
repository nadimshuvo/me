<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledger — A line for the day.</title>
    <meta name="description" content="Ledger. Ink, and a ruled column." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2a2820; --muted: #747064; --paper: #f6f4ee;
        --card: #fbfaf7; --accent: #1d3fbf;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Archivo", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .page{position:absolute;left:16%;right:16%;top:24px;bottom:24px;background:#fff;background-image:repeating-linear-gradient(#e7e0d4 0 2px,transparent 2px 28px)}.line{position:absolute;left:22%;top:48px;height:3px;width:0;background:var(--accent);animation:write 2.8s linear infinite}@keyframes write{to{width:56%}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Ledger</a>
      <span>The book</span>
    </header>
    <main id="top">
      <h1>A line for the day.</h1>
      <p class="lede">Ink, and a ruled column.</p>
      <div class="stage" aria-hidden="true"><span class="page"></span><span class="go line"></span></div>
    </main>
    <footer>
      <span>The book</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
