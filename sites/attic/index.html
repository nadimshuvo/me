<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attic — Dust in a shaft of sun.</title>
    <meta name="description" content="Attic. What was put away, still here." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #3a3228; --muted: #8a7d70; --paper: #f4efe6;
        --card: #fbf7f2; --accent: #f0d9a0;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Lexend", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .beam{position:absolute;left:40%;top:-10%;width:80px;height:140%;background:linear-gradient(180deg,transparent,rgba(240,217,160,.55),transparent);transform:rotate(18deg)}.mote{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.8}.a{left:42%;top:40px;animation:float 4s ease-in-out infinite}.b{left:50%;top:90px;animation:float 5s ease-in-out infinite}.c{left:58%;top:60px;animation:float 3.6s ease-in-out infinite}@keyframes float{50%{transform:translateY(-20px)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Attic</a>
      <span>Under the eaves</span>
    </header>
    <main id="top">
      <h1>Dust in a shaft of sun.</h1>
      <p class="lede">What was put away, still here.</p>
      <div class="stage" aria-hidden="true"><span class="beam"></span><span class="go mote a"></span><span class="go mote b"></span><span class="go mote c"></span></div>
    </main>
    <footer>
      <span>Under the eaves</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
