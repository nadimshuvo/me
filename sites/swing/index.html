<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swing — A seat on two ropes.</title>
    <meta name="description" content="Swing. Out, and the return." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #243024; --muted: #5e705c; --paper: #f3f6f1;
        --card: #f7faf6; --accent: #6e8f4e;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Noto Sans", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .ropes{position:absolute;left:50%;top:0;width:80px;height:180px;margin-left:-40px;border-left:2px solid var(--ink);border-right:2px solid var(--ink);transform-origin:top center;animation:swing 2.6s ease-in-out infinite}.ropes:after{content:'';position:absolute;left:-8px;right:-8px;bottom:0;height:14px;background:var(--accent);border-radius:4px}@keyframes swing{50%{transform:rotate(18deg)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Swing</a>
      <span>The tree</span>
    </header>
    <main id="top">
      <h1>A seat on two ropes.</h1>
      <p class="lede">Out, and the return.</p>
      <div class="stage" aria-hidden="true"><span class="go ropes"></span></div>
    </main>
    <footer>
      <span>The tree</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
