<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ember — What the fire leaves.</title>
    <meta name="description" content="Ember. Sparks go up and go out." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #f8efe6; --muted: #d8c2b0; --paper: #241610;
        --card: #1a100c; --accent: #ff7a3c;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Alegreya", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .stage{background:#1a100c}.bed{position:absolute;left:20%;right:20%;bottom:24px;height:18px;background:#3a241c;border-radius:8px}.spark{position:absolute;bottom:40px;width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:0}.a{left:32%;animation:up 2.4s ease-in infinite}.b{left:50%;animation:up 2.8s ease-in .4s infinite}.c{left:64%;animation:up 2.2s ease-in .8s infinite}@keyframes up{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-140px)}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Ember</a>
      <span>The grate</span>
    </header>
    <main id="top">
      <h1>What the fire leaves.</h1>
      <p class="lede">Sparks go up and go out.</p>
      <div class="stage" aria-hidden="true"><span class="bed"></span><span class="go spark a"></span><span class="go spark b"></span><span class="go spark c"></span></div>
    </main>
    <footer>
      <span>The grate</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
