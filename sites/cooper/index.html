<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cooper — The hoop closes the staves.</title>
    <meta name="description" content="Cooper. A barrel, before the wine." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #3a2e22; --muted: #8a7660; --paper: #f4efe6;
        --card: #fffaf4; --accent: #8d4b2a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Roboto Slab", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .staves{position:absolute;left:50%;bottom:30px;width:120px;height:160px;margin-left:-60px;background:repeating-linear-gradient(90deg,#e6c89a 0 16px,#d7b483 16px 18px);border-radius:18px}.hoop{position:absolute;left:50%;top:30px;width:70px;height:14px;margin-left:-35px;border:4px solid var(--accent);border-radius:8px;animation:close 3s ease-in-out infinite}@keyframes close{to{width:130px;margin-left:-65px;top:120px}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Cooper</a>
      <span>The yard</span>
    </header>
    <main id="top">
      <h1>The hoop closes the staves.</h1>
      <p class="lede">A barrel, before the wine.</p>
      <div class="stage" aria-hidden="true"><span class="staves"></span><span class="go hoop"></span></div>
    </main>
    <footer>
      <span>The yard</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
