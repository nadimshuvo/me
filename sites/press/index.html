<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Press — The platen comes down.</title>
    <meta name="description" content="Press. Ink, then the sheet." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2c241c; --muted: #8a7b6c; --paper: #f6f1e8;
        --card: #fffdf8; --accent: #1f4fd8;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Sorts Mill Goudy", Georgia, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
      a { color: inherit; }
      header, main, footer { width: min(720px, calc(100% - 2rem)); margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.4rem 0; gap: 1rem; }
      .mark { font-weight: 600; font-size: 1.35rem; letter-spacing: -0.03em; text-decoration: none; }
      header span { color: var(--muted); font-size: 0.92rem; }
      h1 { font-weight: 600; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -0.045em; line-height: 0.96; }
      .lede { margin: 1rem 0 1.5rem; max-width: 36rem; color: var(--muted); font-size: 1.05rem; }
      .stage { position: relative; height: 250px; border-radius: 28px; overflow: hidden; background: var(--card); }
      footer { padding: 2.4rem 0 3rem; color: var(--muted); font-size: 0.9rem; display: flex; justify-content: space-between; gap: 1rem; }
      .bed{position:absolute;left:18%;right:18%;bottom:36px;height:16px;background:#e4d8c8}.platen{position:absolute;left:22%;right:22%;top:24px;height:28px;background:var(--ink);animation:press 2.6s ease-in-out infinite}@keyframes press{45%,55%{top:150px}}
      @media (prefers-reduced-motion: reduce) {
        .go, .go * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="#top">Press</a>
      <span>One impression</span>
    </header>
    <main id="top">
      <h1>The platen comes down.</h1>
      <p class="lede">Ink, then the sheet.</p>
      <div class="stage" aria-hidden="true"><span class="bed"></span><span class="go platen"></span></div>
    </main>
    <footer>
      <span>One impression</span>
      <a href="../../atlas.html">Nadim Mahmud Shuvo</a>
    </footer>
  </body>
</html>
